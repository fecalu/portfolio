<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produtos API | João Felipe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2a2d3d;
      --accent:  #6c63ff;
      --accent2: #48cfad;
      --danger:  #f56565;
      --text:    #e2e8f0;
      --muted:   #8892a4;
      --radius:  12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Navbar ── */
    nav {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 2rem;
      background: rgba(15,17,23,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-back {
      color: var(--muted);
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--text); }

    .nav-sep { color: var(--border); }

    .nav-title {
      font-weight: 700;
      font-size: 1rem;
    }

    .nav-badge {
      margin-left: auto;
      background: rgba(72,207,173,0.12);
      color: var(--accent2);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 99px;
    }

    /* ── Layout ── */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; }
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    /* ── Form ── */
    .form-group { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.6rem 0.9rem;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      padding: 0.7rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-primary { background: var(--accent); color: #fff; margin-top: 0.5rem; }
    .btn-danger  { background: var(--danger); color: #fff; }

    /* ── Busca por ID ── */
    .search-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .search-row input { flex: 1; }

    .search-row .btn {
      width: auto;
      padding: 0.6rem 1rem;
      margin-top: 0;
      white-space: nowrap;
    }

    /* ── Resultado da busca ── */
    #resultado-busca {
      display: none;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.88rem;
    }

    #resultado-busca.visivel { display: block; }

    /* ── Lista de produtos ── */
    #lista-produtos { display: flex; flex-direction: column; gap: 0.75rem; }

    .produto-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .produto-info { flex: 1; min-width: 0; }
    .produto-nome { font-weight: 600; font-size: 0.95rem; margin-bottom: 0.2rem; }
    .produto-desc { color: var(--muted); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .produto-preco { font-weight: 700; color: var(--accent2); white-space: nowrap; }

    .btn-del {
      background: rgba(245,101,101,0.12);
      border: 1px solid rgba(245,101,101,0.25);
      color: var(--danger);
      border-radius: 6px;
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .btn-del:hover { background: rgba(245,101,101,0.22); }

    /* ── Estado vazio ── */
    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .empty-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

    /* ── Toast de feedback ── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 1.25rem;
      font-size: 0.88rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 999;
      max-width: 300px;
    }

    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { border-color: var(--accent2); color: var(--accent2); }
    #toast.error   { border-color: var(--danger);  color: var(--danger); }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <a href="/" class="nav-back">← Portfólio</a>
    <span class="nav-sep">|</span>
    <span class="nav-title">Produtos API</span>
    <span class="nav-badge">Spring Boot + H2</span>
  </nav>

  <main>

    <!-- Coluna esquerda: formulário de cadastro -->
    <aside>
      <div class="card">
        <p class="card-title">Cadastrar produto</p>
        <form id="form-produto">
          <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Ex: Teclado mecânico" required />
          </div>
          <div class="form-group">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" placeholder="Ex: Teclado RGB switch blue" />
          </div>
          <div class="form-group">
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" placeholder="Ex: 299.90" step="0.01" min="0" required />
          </div>
          <button type="submit" class="btn btn-primary">Salvar produto</button>
        </form>
      </div>
    </aside>

    <!-- Coluna direita: lista e busca -->
    <section>
      <div class="card">
        <p class="card-title">Buscar por ID</p>

        <!-- Campo de busca por ID -->
        <div class="search-row">
          <input type="text" id="input-busca-id" placeholder="Cole o ID do produto aqui" />
          <button class="btn btn-primary" onclick="buscarPorId()">Buscar</button>
        </div>

        <!-- Resultado da busca aparece aqui -->
        <div id="resultado-busca"></div>

        <p class="card-title">Todos os produtos</p>

        <!-- Lista de produtos -->
        <div id="lista-produtos">
          <div class="empty">
            <div class="empty-icon">📦</div>
            <p>Carregando produtos...</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Toast de feedback -->
  <div id="toast"></div>

  <script>
    // ─────────────────────────────────────────────────────────────
    // URL base da API Spring Boot
    // Em desenvolvimento: aponta para o localhost
    // Em produção: vai apontar para o seu domínio
    // ─────────────────────────────────────────────────────────────
    const API_URL = 'http://localhost:8080/produtos';

    // ── Toast ─────────────────────────────────────────────────────
    // Exibe uma mensagem temporária no canto da tela
    function toast(msg, tipo = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `show ${tipo}`;
      setTimeout(() => { el.className = ''; }, 3000);
    }

    // ── Formata moeda ─────────────────────────────────────────────
    function formatarPreco(valor) {
      return Number(valor).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    // ── Carregar todos os produtos ────────────────────────────────
    // Chama GET /produtos e renderiza a lista na tela
    async function carregarProdutos() {
      const lista = document.getElementById('lista-produtos');

      try {
        // fetch() é a função nativa do navegador para fazer requisições HTTP
        // é a mesma coisa que você faz no Postman, só que pelo código
        const resposta = await fetch(API_URL);

        if (!resposta.ok) throw new Error('Erro ao carregar');

        // .json() converte a resposta (que vem como texto) para um objeto JavaScript
        const produtos = await resposta.json();

        if (produtos.length === 0) {
          lista.innerHTML = `
            <div class="empty">
              <div class="empty-icon">📦</div>
              <p>Nenhum produto cadastrado ainda.</p>
            </div>`;
          return;
        }

        // Para cada produto, cria um card na tela
        lista.innerHTML = produtos.map(p => `
          <div class="produto-item" id="item-${p.id}">
            <div class="produto-info">
              <div class="produto-nome">${p.nome}</div>
              <div class="produto-desc">${p.descricao || '—'}</div>
            </div>
            <div class="produto-preco">${formatarPreco(p.preco)}</div>
            <button class="btn-del" onclick="deletar('${p.id}')">Excluir</button>
          </div>
        `).join('');

      } catch (err) {
        lista.innerHTML = `
          <div class="empty">
            <div class="empty-icon">⚠️</div>
            <p>Não foi possível conectar à API.<br/>Verifique se a aplicação está rodando.</p>
          </div>`;
      }
    }

    // ── Cadastrar produto ─────────────────────────────────────────
    // Chama POST /produtos com os dados do formulário
    document.getElementById('form-produto').addEventListener('submit', async (e) => {
      e.preventDefault(); // impede o comportamento padrão do formulário (recarregar a página)

      const produto = {
        nome:      document.getElementById('nome').value,
        descricao: document.getElementById('descricao').value,
        preco:     parseFloat(document.getElementById('preco').value)
      };

      try {
        const resposta = await fetch(API_URL, {
          method: 'POST',                             // método HTTP
          headers: { 'Content-Type': 'application/json' }, // avisa que está mandando JSON
          body: JSON.stringify(produto)               // converte o objeto para JSON (texto)
        });

        if (!resposta.ok) throw new Error('Erro ao salvar');

        toast('Produto cadastrado com sucesso!');
        e.target.reset(); // limpa o formulário
        carregarProdutos(); // atualiza a lista

      } catch (err) {
        toast('Erro ao cadastrar produto.', 'error');
      }
    });

    // ── Buscar por ID ─────────────────────────────────────────────
    // Chama GET /produtos/{id}
    async function buscarPorId() {
      const id = document.getElementById('input-busca-id').value.trim();
      const resultado = document.getElementById('resultado-busca');

      if (!id) { toast('Digite um ID para buscar.', 'error'); return; }

      try {
        const resposta = await fetch(`${API_URL}/${id}`);

        if (resposta.status === 404 || !resposta.ok) {
          resultado.className = 'visivel';
          resultado.innerHTML = `<span style="color: var(--danger)">Produto não encontrado.</span>`;
          return;
        }

        const p = await resposta.json();

        if (!p) {
          resultado.className = 'visivel';
          resultado.innerHTML = `<span style="color: var(--danger)">Produto não encontrado.</span>`;
          return;
        }

        resultado.className = 'visivel';
        resultado.innerHTML = `
          <strong>${p.nome}</strong><br/>
          <span style="color: var(--muted); font-size:0.82rem">${p.descricao || '—'}</span><br/>
          <span style="color: var(--accent2); font-weight:700">${formatarPreco(p.preco)}</span>
          <br/><span style="color: var(--muted); font-size:0.75rem">ID: ${p.id}</span>
        `;

      } catch (err) {
        toast('Erro ao buscar produto.', 'error');
      }
    }

    // ── Deletar produto ───────────────────────────────────────────
    // Chama DELETE /produtos/{id}
    async function deletar(id) {
      if (!confirm('Tem certeza que deseja excluir este produto?')) return;

      try {
        const resposta = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });

        if (!resposta.ok) throw new Error('Erro ao deletar');

        // Remove o item da tela sem precisar recarregar tudo
        document.getElementById(`item-${id}`)?.remove();
        toast('Produto excluído.');

      } catch (err) {
        toast('Erro ao excluir produto.', 'error');
      }
    }

    // Carrega a lista quando a página abre
    carregarProdutos();
  </script>

</body>
</html>
